name: Publish tested Small AI early release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify passed run and package unchanged binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/38035599801 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/38035599801 --jq .head_sha)" = 79a63baf066119335b683d91b9606de44216df80
          gh api repos/$GH_REPO/actions/artifacts/11663387762/zip > original.zip
          echo '0fe9d982090eea8be2784b4cbe10fd9e915ab5050ad593adccf04154049aad8a  original.zip' | sha256sum -c -
          unzip -q original.zip -d original
          cp README.md original/dist/README.md
          curl -fLsS https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.31/dotnet-runtime-8.0.31-win-x64.zip -o runtime.zip
          echo '9c55c58694676ee64b0eed2cd6d8cbf58b9aa8288420acc66841e15ca0099c75d4af0182d23a641c2342e5a151a325df4a12fa0bde2e47c0fb7e9a33e7b09896  runtime.zip' | sha512sum -c -
          unzip -p runtime.zip LICENSE.txt > original/dist/licenses/dotnet-Windows-LICENSE.txt
          unzip -p runtime.zip ThirdPartyNotices.txt > original/dist/licenses/dotnet-ThirdPartyNotices.txt
          curl -fLsS https://raw.githubusercontent.com/dotnet/core/main/LICENSE.TXT -o original/dist/licenses/dotnet-MIT.txt
          curl -fLsS https://raw.githubusercontent.com/dotnet/core/main/license-information-windows.md -o original/dist/licenses/dotnet-Windows-license-information.md
          curl -fLsS https://learn.microsoft.com/legal/windows-sdk/license -o original/dist/licenses/Windows-SDK-license.html
          test -s original/dist/licenses/dotnet-Windows-LICENSE.txt
          test -s original/dist/licenses/dotnet-ThirdPartyNotices.txt
          (cd original/dist && zip -qr ../../SmallAI-Windows-x64.zip .)
          sha256sum SmallAI-Windows-x64.zip > SHA256SUMS.txt
          cp README.md release-notes.md
          printf '\n## Download integrity\n\n' >> release-notes.md
          cat SHA256SUMS.txt >> release-notes.md
          gh release create v0.1.0-preview SmallAI-Windows-x64.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Small AI 0.1.0 - Windows early release' --notes-file release-notes.md --prerelease
