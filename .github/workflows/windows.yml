name: Private Windows prototype tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Windows app
        shell: pwsh
        run: |
          ./prepare.ps1
          dotnet publish src/SmallAI.csproj -c Release -r win-x64 --self-contained true -o dist
      - name: Bundle pinned CPU engine and licenses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest https://github.com/ggml-org/llama.cpp/releases/download/b9999/llama-b9999-bin-win-cpu-x64.zip -OutFile engine.zip
          Expand-Archive engine.zip dist/engine
          New-Item dist/licenses -ItemType Directory -Force
          Invoke-WebRequest https://raw.githubusercontent.com/ggml-org/llama.cpp/b9999/LICENSE -OutFile dist/licenses/llama-MIT.txt
          Invoke-WebRequest https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4/LICENSE -OutFile dist/licenses/Qwen3-Apache.txt
          Invoke-WebRequest https://huggingface.co/Qwen/Qwen3.5-0.8B/resolve/main/LICENSE -OutFile dist/licenses/Qwen35-Apache.txt
          Invoke-WebRequest https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/LICENSE -OutFile dist/licenses/Apache-2.0.txt
          Copy-Item README.md dist
          Get-FileHash dist/engine/* | Format-Table | Out-File dist/engine-hashes.txt
      - name: Render actual Windows UI
        shell: pwsh
        run: |
          $p=Start-Process dist/SmallAI.exe -ArgumentList '--ui-test' -PassThru -Wait
          if($p.ExitCode -ne 0 -or !(Test-Path dist/ui-home.png)){throw 'WPF UI render failed'}
      - name: Standard-user expanded regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $password=ConvertTo-SecureString ('Test!'+[guid]::NewGuid().ToString()) -AsPlainText -Force
          New-LocalUser -Name SmallAITester -Password $password | Out-Null
          Add-LocalGroupMember -Group Users -Member SmallAITester
          $target='C:\Small AI Test'
          New-Item $target -ItemType Directory -Force
          Copy-Item dist/* $target -Recurse
          icacls $target /grant 'SmallAITester:(OI)(CI)M'
          $cred=New-Object System.Management.Automation.PSCredential('.\SmallAITester',$password)
          $p=Start-Process "$target/SmallAI.exe" -ArgumentList '--regression-test' -Credential $cred -LoadUserProfile -WorkingDirectory $target -PassThru
          if(!$p.WaitForExit(1200000)){Stop-Process -Id $p.Id -Force;throw 'Regression timeout'}
          New-Item evidence -ItemType Directory -Force
          Copy-Item "$target/*.txt","$target/*.png" evidence -ErrorAction SilentlyContinue
          Get-Content evidence/regression-results.txt
          if($p.ExitCode -ne 0){Get-Content evidence/regression-error.txt;throw "Regression failed $($p.ExitCode)"}
      - name: Upload private app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmallAI-Windows-private-prototype
          path: |
            dist
            evidence
          retention-days: 2
